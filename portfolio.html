<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio Template</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/portfolio-preview.css" />
</head>
<body>

<header class="top-bar">
  <a href="home.html" class="back-btn">←</a>
  <h2>Portfolio Template</h2>
</header>

<main class="portfolio-preview">

  <section class="template-preview">
    <h1>Jane Doe</h1>
    <p class="role">Frontend Developer</p>
    <p class="bio">
      I build clean, responsive interfaces using HTML and CSS.
    </p>
  </section>

  <section class="template-preview">
    <h2>Skills</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>Responsive Design</li>
    </ul>
  </section>

  <section class="template-preview">
    <h2>Projects</h2>
    <div class="projects">
      <div class="project-card">Project One</div>
      <div class="project-card">Project Two</div>
      <div class="project-card">Project Three</div>
    </div>
  </section>

  <section class="template-preview">
    <h2>Contact</h2>
    <p>Email: you@example.com</p>
  </section>

  <button onclick="downloadPortfolio()">Download HTML & CSS</button>

</main>

<script>
function downloadPortfolio() {
  window.location.href = "downloads/portfolio.zip";
}
</script>

</body>
</html>
