<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz | Frontend Quiz App</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>

  <!-- Top bar.-->
  <header class="top-bar">
    <a href="home.html" class="back-btn" aria-label="Go back">
        ←
    </a>

    <h2 id="quizTitle">HTML Quiz</h2>
  </header>

  <!-- Quiz container.-->
  <main class="quiz-container">

    <!-- Progress.-->
    <p class="progress-text" id="progressText">
      Question 1 of 20
    </p>

    <!-- Question card.-->
    <section class="question-card">
      <h3 class="question-text" id="questionText">
        What does HTML stand for?
      </h3>

      <!-- Options.-->
      <div class="options">
        <button class="option">Hyper Text Markup Language</button>
        <button class="option">High Text Machine Language</button>
        <button class="option">Hyperlinks and Text Markup Language</button>
        <button class="option">Home Tool Markup Language</button>
      </div>
    </section>

    <!-- Navigation.-->
    <div class="quiz-actions">
      <button class="next-btn">Next</button>
    </div>

  </main>

  
  <script src="js/quiz-data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
