<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>

<header class="top-bar">
  <a href="home.html" class="back-btn">←</a>
  <h2>Profile</h2>
</header>

<main class="profile-container">
  <h1 id="profileName"></h1>

  <div class="profile-card">
    <p><strong>Total quizzes taken:</strong> <span id="attempts"></span></p>
    <p><strong>Best HTML score:</strong> <span id="htmlScore"></span></p>
    <p><strong>Best CSS score:</strong> <span id="cssScore"></span></p>
  </div>

  <button class="danger-btn" id="resetBtn">
    Reset Progress
  </button>
</main>

<script src="js/profile.js"></script>
</body>
</html>
