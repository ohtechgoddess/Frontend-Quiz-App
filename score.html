<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Results</title>
  <link rel="stylesheet" href="css/score.css" />
</head>
<body>

  <main class="score-container">
    <h1 id="scoreTitle"></h1>

    <div class="score-card">
      <p class="score-main" id="scoreText"></p>
      <p class="score-percent" id="scorePercent"></p>

      <h2 id="feedbackTitle"></h2>
      <p id="feedbackMessage"></p>
    </div>

    <div class="score-actions">
      <button onclick="location.href='home.html'">Home</button>
      <button onclick="location.href='quiz.html?type=' + localStorage.getItem('quizType')">
        Retry Quiz
      </button>
    </div>
  </main>

  <script src="js/score.js"></script>
</body>
</html>
